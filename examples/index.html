<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dot.js | Test Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fcfaf7; color: #333; font-family: 'Inter', sans-serif; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 2rem; max-width: 1400px; margin: 0 auto; }
        .test-card { background: #ffffff; border: 1px solid #e5e5e5; padding: 1.5rem; }
        .test-card canvas { width: 100%; height: 200px; background: #f7f5f2; border: 1px solid #e5e5e5; }
        .status { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1rem; }
        .status.running { background: #fef9c3; color: #854d0e; }
        .status.passed { background: #dcfce7; color: #166534; }
        .status.failed { background: #fee2e2; color: #991b1b; }
        .log { max-width: 1400px; margin: 3rem auto; background: #f7f5f2; border: 1px solid #e5e5e5; padding: 1.5rem; font-family: 'Courier New', monospace; font-size: 0.85rem; height: 200px; overflow-y: auto; }
    </style>
</head>
<body class="p-10">

    <header class="text-center mb-16">
        <h1 class="text-5xl font-black mb-4">Test Suite</h1>
        <p class="text-zinc-500">Testing core features - Web Worker powered.</p>
    </header>

    <div class="text-center mb-12">
        <button id="runAllBtn" class="bg-zinc-900 text-white px-8 py-3 rounded-full font-bold hover:bg-lime-500 hover:text-black transition-colors">Run All Tests</button>
        <button id="clearBtn" class="bg-zinc-200 text-zinc-800 px-8 py-3 rounded-full font-bold ml-4 hover:bg-zinc-300 transition-colors">Clear Log</button>
    </div>

    <div class="test-grid" id="testGrid">
        <!-- Test cards injected here -->
    </div>

    <div class="log" id="logContainer">
        <div class="log-entry border-b border-zinc-200 py-1">
            <span class="text-lime-600 font-bold mr-3">[SYSTEM]</span>
            <span>Test suite initialized. Ready to execute.</span>
        </div>
    </div>

    <script src="../../dist/dotjs.js"></script>
    <script src="test.js"></script>
</body>
</html>
