<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Fractal Tree </title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            color: #22c55e;
        }
        canvas {
            display: block;
            cursor: pointer;
        }
        .ui {
            position: absolute;
            bottom: 20px;
            text-align: center;
            pointer-events: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .ui span {
            color: #4ecdc4;
        }
    </style>
</head>
<body>

    <canvas id="treeCanvas"></canvas>
    <div class="ui">
    
    </div>

    <script src="../../dist/dotjs.js"></script>
    <script>
      

        const canvas = document.getElementById('treeCanvas');
        let width, height;
        let app;
        let treeBranches = [];
        let branchId = 0;
        let time = 0;

        //         Store original branch data        
        let originalBranches = [];

        //         Draw Branch        
        function drawBranch(x, y, len, angle, branchWidth, depth, maxDepth) {
            if (depth === 0 || len < 2) return;

            const endX = x + len * Math.cos(angle);
            const endY = y + len * Math.sin(angle);

            // Ethereal glow styling - green with varying opacity
            const opacity = 0.3 + (depth / maxDepth) * 0.7;
            const color = `rgba(34, 197, 94, ${opacity})`;
            const width = Math.max(0.5, branchWidth * (0.3 + (depth / maxDepth) * 0.7));

            // Create branch line
            const branch = line(x, y, endX, endY)
                .stroke(color, width)
                .setRef(`branch_${branchId++}`);
            
            // Store branch data with original values
            const branchData = {
                ref: branch.refKey,
                x1: x, y1: y,
                x2: endX, y2: endY,
                angle: angle,
                length: len,
                depth: depth,
                width: width,
                phase: Math.random() * Math.PI * 2,
                speed: 0.2 + Math.random() * 0.3,
                swayAmount: 0.003 + Math.random() * 0.005,
                // Store the original end position for recalculation
                baseX2: endX,
                baseY2: endY,
            };
            
            treeBranches.push(branchData);
            originalBranches.push({ ...branchData });

            // Recursive growth with organic branching
            const spread = 0.5 + (Math.random() * 0.2);
            const nextLen = len * (0.7 + Math.random() * 0.1);
            const nextWidth = branchWidth * (0.65 + Math.random() * 0.1);

            // Left branch
            drawBranch(endX, endY, nextLen, angle - spread, nextWidth, depth - 1, maxDepth);
            
            // Right branch
            drawBranch(endX, endY, nextLen, angle + spread, nextWidth, depth - 1, maxDepth);

            // Random extra branch
            if (Math.random() > 0.6 && depth > 2) {
                const extraAngle = angle + (Math.random() - 0.5) * 0.4;
                drawBranch(endX, endY, nextLen * 0.6, extraAngle, nextWidth * 0.5, depth - 1, maxDepth);
            }

            // Leaf at tip
            if (depth < 3 && Math.random() > 0.7) {
                const leafSize = 1 + Math.random() * 2;
                const leafColor = `rgba(34, 197, 94, ${0.3 + Math.random() * 0.5})`;
                circle(endX, endY, leafSize)
                    .fill(leafColor)
                    .setRef(`leaf_${branchId++}`);
            }
        }

        //         Draw Tree        
        function drawTree() {
            // Clear previous tree
            for (const b of treeBranches) {
                const ref = useRef(b.ref);
                if (ref) {
                    const appInstance = window.__dotjs_app;
                    if (appInstance && appInstance.bridge) {
                        appInstance.bridge.send({
                            type: 'REGISTRY_DELETE',
                            payload: { key: b.ref }
                        });
                    }
                }
            }
            treeBranches = [];
            originalBranches = [];
            branchId = 0;
            time = 0;

            // Draw new tree
            const startX = width / 2;
            const startY = height;
            const startLen = Math.min(height, width) / 5;
            const maxDepth = 11;

            console.log('🌳 Growing ethereal tree...');
            drawBranch(startX, startY, startLen, -Math.PI / 2, 8, maxDepth, maxDepth);
            console.log(`✅ Generated ${treeBranches.length} branches`);
        }

        //         Update Tree Animation        
        function updateTree() {
            time += 0.01;

            for (let i = 0; i < treeBranches.length; i++) {
                const b = treeBranches[i];
                const ref = useRef(b.ref);
                if (!ref) continue;

                const points = ref.points;
                if (!points || points.length < 2) continue;

                // Calculate sway using the original angle
                const sway = Math.sin(time * b.speed + b.phase) * b.swayAmount * 0.5;
                const newAngle = b.angle + sway;
                
                // Recalculate end position from start position
                const newX2 = b.x1 + b.length * Math.cos(newAngle);
                const newY2 = b.y1 + b.length * Math.sin(newAngle);
                
                // Update line end point
                points[1].x = newX2;
                points[1].y = newY2;
                
                ref.isDirty = true;
            }
        }

        //         Setup App        
        function initApp() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            canvas.width = width;
            canvas.height = height;

            // Create app with the canvas
            app = createCanvas(width, height, {
                use: canvas,
                background: '#050505',
            });

            // Draw initial tree
            drawTree();

            // Animation loop
            app.draw(() => {
                updateTree();
            });
        }

        //         Resize        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            if (app) {
                app.resize(width, height);
            }
            
            drawTree();
        }

        //         Click Handler        
        function handleClick() {
            drawTree();
        }



        //         Initialize        
        initApp();

       
    </script>
</body>
</html>
